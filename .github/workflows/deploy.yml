name: Create bundle artifact

on:
  workflow_dispatch:
    inputs:
      major_counter:
        description: "App version major counter"
        required: true
        default: "1"
      minor_counter:
        description: "App version minor counter"
        required: true
        default: "0"
      patch_counter:
        description: "App version patch counter"
        required: true
        default: "0"

jobs:
  Build_and_Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Output build counter
        env:
          MAJOR_COUNTER: ${{ github.event.inputs.major_counter }}
          MINOR_COUNTER: ${{ github.event.inputs.minor_counter }}
          PATCH_COUNTER: ${{ github.event.inputs.patch_counter }}
        run: |
          echo "Version: $MAJOR_COUNTER.$MINOR_COUNTER.$PATCH_COUNTER"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Decode and save keystore file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/friendlyemotions_upload.jks

      - name: Build release AAB
        env:
          KEYSTORE_PATH: friendlyemotions_upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAJOR_COUNTER: ${{ github.event.inputs.major_counter }}
          MINOR_COUNTER: ${{ github.event.inputs.minor_counter }}
          PATCH_COUNTER: ${{ github.event.inputs.patch_counter }}
        run: |
          ./gradlew bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ./app/build/outputs/bundle/release/app-release.aab
